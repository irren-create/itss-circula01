<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Circula | Marketplace Limbah Industri Sirkular</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --p:#566a14;--on-p:#fff;--pc:#dcf1a6;--on-pc:#172000;--lime:#a9d43c;--on-lime:#1f2b00;
  --s:#f4f6ee;--sc:#e8eddb;--sch:#dde4cc;--on-s:#1a1d14;--on-sv:#464a3a;--ol:#788069;--olv:#cbd1bb;
  --tile:#5d6a1f;--tile-ic:#e6f4b8;--err:#ba1a1a;--errc:#ffdad6;--warn:#7a4b00;--warnc:#ffddb0;
  --water:#d3e8e0;--row:#e3f1c3;--elev:0 1px 3px rgba(30,40,0,.18),0 6px 16px rgba(30,40,0,.08);color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --p:#bdd864;--on-p:#273400;--pc:#3b4b02;--on-pc:#dcf1a6;--lime:#5f7d16;--on-lime:#f0ffc2;
  --s:#12150d;--sc:#1d2214;--sch:#283019;--on-s:#e4e8d8;--on-sv:#c5cab4;--ol:#8f9580;--olv:#444a38;
  --tile:#3f4d0c;--tile-ic:#cfe58a;--err:#ffb4ab;--errc:#93000a;--warn:#ffb957;--warnc:#5e3a00;--water:#22332d;--row:#232b15;
  --elev:0 1px 3px rgba(0,0,0,.5),0 6px 16px rgba(0,0,0,.3);color-scheme:dark}}
:root[data-theme="dark"]{
  --p:#bdd864;--on-p:#273400;--pc:#3b4b02;--on-pc:#dcf1a6;--lime:#5f7d16;--on-lime:#f0ffc2;
  --s:#12150d;--sc:#1d2214;--sch:#283019;--on-s:#e4e8d8;--on-sv:#c5cab4;--ol:#8f9580;--olv:#444a38;
  --tile:#3f4d0c;--tile-ic:#cfe58a;--err:#ffb4ab;--errc:#93000a;--warn:#ffb957;--warnc:#5e3a00;--water:#22332d;--row:#232b15;
  --elev:0 1px 3px rgba(0,0,0,.5),0 6px 16px rgba(0,0,0,.3);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--s);color:var(--on-s);font:400 16px/1.5 Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,p,dl,dd,ul{margin:0}
ul{padding:0;list-style:none}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--p);outline-offset:2px}
.ic{flex:none;display:block}
h1,h2,h3,.disp{font-family:Outfit,Roboto,system-ui,sans-serif;font-weight:600;letter-spacing:-.01em}
.sub{color:var(--on-sv);font-size:14px}
.grow{flex:1}

/* layout */
main{min-height:100vh;padding-bottom:120px}
.page{max-width:980px;margin:0 auto;padding:0 16px 24px}
.bare main{padding-bottom:0}
.bare .bottombar,.bare .rail,.bare .fab{display:none}
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:4px;min-height:64px;padding:0 8px 0 4px;background:var(--s)}
.appbar.nb{padding-left:20px}
.appbar h1{font-size:22px;line-height:1.2;padding-left:4px}
.appbar.nb h1{padding-left:0}
.icbtn{width:48px;height:48px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;color:var(--on-sv)}
.icbtn:hover{background:var(--sc)}
.fav.on{color:var(--err)}
.max{max-width:980px;margin:0 auto}

/* nav */
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--sc);padding:12px 8px calc(16px + env(safe-area-inset-bottom,0px));border-radius:24px 24px 0 0}
.navi{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:500;color:var(--on-sv)}
.navi .pill{width:64px;height:32px;border-radius:16px;display:grid;place-items:center}
.navi.on{color:var(--on-s)}
.navi.on .pill{background:var(--pc);color:var(--on-pc)}
.rail{display:none}
.fab{position:fixed;right:16px;bottom:calc(104px + env(safe-area-inset-bottom,0px));z-index:25;display:inline-flex;align-items:center;gap:12px;height:56px;padding:0 20px 0 16px;border-radius:16px;background:var(--lime);color:var(--on-lime);font-weight:500;box-shadow:var(--elev)}
@media (min-width:840px){
  .bottombar{display:none}
  .rail{position:fixed;left:0;top:0;bottom:0;width:96px;z-index:30;display:flex;flex-direction:column;align-items:center;gap:12px;padding:calc(24px + env(safe-area-inset-top,0px)) 0 24px;background:var(--s);border-right:1px solid var(--olv)}
  .rail .navi{flex:none;width:80px}
  .rail .logo{color:var(--p);margin-bottom:12px}
  main{margin-left:96px;padding-bottom:48px}
  .bare main{margin-left:0}
  .fab{bottom:24px;right:24px}
  .page{padding:0 32px 32px}
}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 24px;border-radius:999px;border:0;font-weight:500;font-size:15px;cursor:pointer;text-align:center}
.btn.fill{background:var(--p);color:var(--on-p)}
.btn.tonal{background:var(--pc);color:var(--on-pc)}
.btn.outline{background:transparent;border:1px solid var(--ol);color:var(--p)}
.btn.text{background:transparent;color:var(--p);padding:0 12px}
.btn.block{width:100%}
.btn.danger{color:var(--err)}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* inputs */
.search{display:flex;align-items:center;gap:12px;height:56px;padding:0 20px;border-radius:999px;background:var(--sc);color:var(--on-sv)}
.search input{flex:1;min-width:0;border:0;background:transparent;outline:0;color:var(--on-s)}
.fld{display:block;margin-bottom:16px}
.fld>span{display:block;font-size:14px;font-weight:500;margin-bottom:6px;color:var(--on-sv)}
.fld input,.fld select,.fld textarea{width:100%;height:52px;padding:0 16px;border-radius:14px;border:1px solid var(--ol);background:transparent;outline:0}
.fld textarea{height:96px;padding:12px 16px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--p);box-shadow:0 0 0 1px var(--p)}
.fld select option{background:var(--s);color:var(--on-s)}
.fld small{display:block;margin-top:4px;color:var(--on-sv);font-size:13px}
input[type=range]{width:100%;accent-color:var(--p);height:32px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:10px;border:1px solid var(--ol);background:transparent;color:var(--on-sv);font-size:14px;font-weight:500}
.chip.on{background:var(--pc);color:var(--on-pc);border-color:transparent}
.seg{display:flex;border:1px solid var(--ol);border-radius:999px;overflow:hidden}
.seg button{flex:1;height:44px;border:0;background:transparent;font-weight:500;font-size:14px;color:var(--on-sv)}
.seg button+button{border-left:1px solid var(--ol)}
.seg button.on{background:var(--pc);color:var(--on-pc)}
.err{color:var(--err);font-size:14px;min-height:20px;margin:-4px 0 8px}
.chk{display:flex;gap:12px;align-items:flex-start;margin:4px 0 16px;font-size:14px;color:var(--on-sv)}
.chk input{width:20px;height:20px;margin-top:2px;accent-color:var(--p)}

/* tiles (image placeholders from wireframe) */
.tile{background:var(--tile);color:var(--tile-ic);border-radius:14px;display:grid;place-items:center;overflow:hidden;aspect-ratio:1/1;width:100%}
.tile svg{width:52%;height:52%}
.tile img{width:100%;height:100%;object-fit:cover}
.tile.sm{width:56px;height:56px;border-radius:12px}
.badge{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 10px;border-radius:8px;background:var(--pc);color:var(--on-pc);font-size:13px;font-weight:500}
.badge.warn{background:var(--warnc);color:var(--warn)}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--on-sv);font-size:13px}
.meta span{display:inline-flex;align-items:center;gap:4px}

/* rows */
.row{position:relative;display:flex;align-items:center;gap:12px;padding:8px 12px 8px 8px;border-radius:18px;background:var(--row);margin-bottom:10px}
.row .tile{width:56px;height:56px;border-radius:12px;flex:none}
.rowb{flex:1;min-width:0}
.rowb h3{font-size:16px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowp{text-align:right;flex:none}
.rowp strong{display:block;font-size:15px}
.rowp small{color:var(--on-sv);font-size:12px}
.stretch{position:absolute;inset:0;border-radius:inherit;z-index:1}
.row .fav,.lcard .fav{position:relative;z-index:2}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:28px 0 8px}
.sec h2{font-size:20px}
.sec a{color:var(--p);font-weight:500;font-size:14px}
.card{background:var(--sc);border-radius:20px;padding:16px}
.card.pc{background:var(--pc);color:var(--on-pc)}

/* listing grid */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (min-width:600px){.grid{grid-template-columns:repeat(3,1fr)}}
@media (min-width:1000px){.grid{grid-template-columns:repeat(4,1fr)}}
.lcard{position:relative;background:var(--row);border-radius:20px;padding:8px;display:flex;flex-direction:column;gap:8px}
.lc-img{position:relative}
.lc-img .tile{aspect-ratio:4/3;border-radius:14px}
.lc-img .fav{position:absolute;right:4px;top:4px;width:40px;height:40px;background:color-mix(in srgb,var(--s) 80%,transparent);color:var(--on-sv)}
.lc-img .fav.on{color:var(--err)}
.lc-img .gr{position:absolute;left:8px;bottom:8px;height:24px;padding:0 8px;border-radius:8px;background:var(--s);color:var(--on-s);font-size:12px;font-weight:500;display:flex;align-items:center}
.lc-b{padding:0 6px 6px}
.lc-b h3{font-size:15px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em}
.lc-b .pr{font-weight:700;margin:4px 0}
.lc-b .pr small{font-weight:400;color:var(--on-sv)}
.sortbar{display:flex;justify-content:space-between;align-items:center;margin:4px 0 12px;font-size:14px;color:var(--on-sv)}
.sortbar select{height:36px;border-radius:10px;border:1px solid var(--ol);background:transparent;padding:0 8px}
.sortbar select option{background:var(--s);color:var(--on-s)}
.empty{text-align:center;padding:48px 16px;color:var(--on-sv)}
.empty h3{color:var(--on-s);margin-bottom:8px}
.empty .btn{margin-top:16px}

/* home */
.hello{display:flex;align-items:center;gap:12px;padding:16px 4px 12px}
.avatar{width:48px;height:48px;border-radius:50%;background:var(--tile);color:var(--tile-ic);display:grid;place-items:center;font:600 18px Outfit,sans-serif;flex:none}
.hello h1{font-size:20px;line-height:1.2}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:20px}
.quick a{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px;font-weight:500;text-align:center}
.quick .c{width:60px;height:60px;border-radius:50%;background:var(--tile);color:var(--tile-ic);display:grid;place-items:center}
.carousel{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:4px 16px 12px;scrollbar-width:none}
.carousel::-webkit-scrollbar{display:none}
.hcard{position:relative;flex:none;width:min(78%,300px);scroll-snap-align:center;background:var(--row);border-radius:24px;padding:10px}
.hcard .tile{aspect-ratio:16/11;border-radius:16px}
.hcard h3{font-size:17px;line-height:1.3;margin:12px 6px 4px}
.hcard .meta,.hcard .pr{margin:0 6px 6px}
.hcard .pr{font-weight:700}
.dots{display:flex;gap:8px;justify-content:center;margin:16px 0}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--olv)}
.dots i.on{background:var(--p);width:24px;border-radius:4px}
.price-row{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--olv)}
.price-row:last-child{border-bottom:0}
.up{color:var(--p)}.down{color:var(--err)}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat3 div{background:var(--s);border-radius:14px;padding:12px 8px;text-align:center}
.stat3 b{display:block;font:600 20px Outfit,sans-serif}
.stat3 small{font-size:12px;color:var(--on-sv)}
.cta{display:flex;gap:16px;align-items:center;background:var(--pc);color:var(--on-pc);border-radius:24px;padding:20px;margin-top:28px}
.cta h3{font-size:18px;margin-bottom:4px}

/* splash, onboarding, auth */
.splash{min-height:100vh;min-height:100svh;background:var(--lime);color:var(--on-lime);display:flex;flex-direction:column;align-items:center;padding:48px 24px calc(40px + env(safe-area-inset-bottom,0px))}
.sp-mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px}
.sp-mid h1{font-size:52px;line-height:1}
.sp-mid p{font-size:18px;max-width:20ch;opacity:.85;margin-top:4px}
.sp-btm{display:flex;flex-direction:column;gap:12px;width:min(380px,100%);align-items:stretch}
.sp-btm .btn.fill{background:var(--on-lime);color:var(--lime)}
.sp-btm .btn.outline{border-color:var(--on-lime);color:var(--on-lime)}
.sp-btm .btn.text{color:var(--on-lime)}
.splash .logo{animation:spin .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes spin{from{transform:rotate(-200deg) scale(.5);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.splash .logo{animation:none}}
.narrow{width:min(440px,100%);margin:0 auto;padding:0 20px}
.auth h1{font-size:30px;text-align:center;padding:40px 0 20px}
.ob{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;align-items:center;padding:32px 24px calc(32px + env(safe-area-inset-bottom,0px))}
.ob .head{width:min(440px,100%)}
.ob h1{font-size:28px;line-height:1.2;margin:16px 0 8px}
.ob .art{width:min(320px,78%);margin:20px auto}
.ob .art .tile{aspect-ratio:4/5;border-radius:28px}
.ob .art .tile svg{width:46%;height:46%}
.ob .foot{width:min(440px,100%);margin-top:auto}

/* detail */
.detail{display:grid;gap:20px}
.d-img .tile{aspect-ratio:4/3;border-radius:24px}
.d-info h2{font-size:26px;line-height:1.2;margin:8px 0}
.price{font:700 28px Outfit,sans-serif}
.price small{font:400 15px Roboto,sans-serif;color:var(--on-sv)}
.lead{margin:12px 0;color:var(--on-sv)}
.specs{display:grid;grid-template-columns:auto 1fr;gap:10px 16px;margin:16px 0;font-size:15px}
.specs dt{color:var(--on-sv)}
.specs dd{font-weight:500;text-align:right}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
.two .card b{display:block;font:600 20px Outfit,sans-serif}
.two .card small{color:var(--on-sv)}
.seller{display:flex;gap:12px;align-items:center;margin:16px 0}
.seller .avatar{width:48px;height:48px}
.acts{display:flex;gap:12px;flex-wrap:wrap}
.acts .btn{flex:1;min-width:140px}
@media (min-width:840px){.detail{grid-template-columns:1.1fr 1fr;align-items:start}.d-img{position:sticky;top:80px}}

/* map */
.peta{display:grid;gap:0}
.mapbox{position:relative;height:46vh;min-height:320px;border-radius:0 0 28px 28px;overflow:hidden;background:var(--sc)}
.mapsvg{position:absolute;inset:0;width:100%;height:100%}
.me{position:absolute;left:50%;top:55%;width:18px;height:18px;border-radius:50%;background:var(--lime);border:4px solid var(--on-s);transform:translate(-50%,-50%);box-shadow:0 0 0 8px color-mix(in srgb,var(--lime) 35%,transparent)}
.me-l{position:absolute;left:50%;top:55%;transform:translate(-50%,16px);font-size:12px;font-weight:500;background:var(--s);padding:1px 8px;border-radius:8px}
.pin{position:absolute;transform:translate(-50%,-100%);border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;z-index:2}
.pin .pb{width:38px;height:38px;border-radius:50% 50% 50% 8px;transform:rotate(-45deg);background:var(--tile);color:var(--tile-ic);display:grid;place-items:center;box-shadow:var(--elev);border:2px solid var(--s)}
.pin .pb svg{transform:rotate(45deg);width:20px;height:20px}
.pin.on{z-index:4}
.pin.on .pb{background:var(--lime);color:var(--on-lime);width:48px;height:48px;border-color:var(--on-s)}
.pin.on .pb svg{width:24px;height:24px}
.pin .lab{position:absolute;bottom:100%;margin-bottom:6px;white-space:nowrap;background:var(--s);padding:3px 10px;border-radius:8px;font-size:12px;font-weight:500;box-shadow:var(--elev)}
.mapchips{position:absolute;left:0;right:0;top:0;padding:8px 16px 0;z-index:5}
.mapchips .chip{background:var(--s)}
.mapchips .chip.on{background:var(--pc)}
.sheet{padding:16px;margin-top:-8px}
.sheet .modes{margin-bottom:12px}
.match{position:relative;background:var(--row);border-radius:20px;padding:12px;margin-bottom:10px;display:flex;gap:12px}
.match.sel{outline:2px solid var(--p)}
.match .tile{width:56px;height:56px;border-radius:12px;flex:none}
.match h3{font-size:16px;line-height:1.25}
.score{margin-left:auto;flex:none;align-self:flex-start;height:28px;padding:0 10px;border-radius:14px;background:var(--p);color:var(--on-p);font-size:13px;font-weight:500;display:flex;align-items:center}
.match .btn{height:36px;font-size:14px;padding:0 16px;margin-top:8px;position:relative;z-index:2}
@media (min-width:840px){.peta{grid-template-columns:1.25fr 1fr;gap:20px;padding:0 24px}.mapbox{height:calc(100vh - 96px);border-radius:28px;position:sticky;top:16px;margin-top:16px}.sheet{padding:16px 0}}

/* calculator */
.circs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:20px 0}
.circ{aspect-ratio:1/1;border-radius:50%;background:var(--pc);color:var(--on-pc);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8px}
.circ b{font:600 clamp(17px,4.6vw,26px)/1.1 Outfit,sans-serif}
.circ small{font-size:clamp(10px,2.8vw,13px);line-height:1.2;margin-top:2px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--olv);font-size:15px}
.kv:last-child{border:0}
.kv b{font-weight:500;text-align:right}
.note{font-size:13px;color:var(--on-sv);display:flex;gap:8px;align-items:flex-start;margin-top:12px}
@media (min-width:840px){.calcgrid{display:grid;grid-template-columns:1fr 1fr;gap:32px;align-items:start}.circ{aspect-ratio:auto;border-radius:28px;min-height:120px}}

/* timeline */
.steps{position:relative}
.step{display:flex;gap:16px;position:relative;padding-bottom:20px}
.step:not(:last-child)::before{content:"";position:absolute;left:15px;top:32px;bottom:0;width:2px;background:var(--olv)}
.step.done:not(:last-child)::before{background:var(--p)}
.dot{width:32px;height:32px;border-radius:50%;border:2px solid var(--olv);display:grid;place-items:center;flex:none;background:var(--s);color:var(--on-sv);font-size:13px;font-weight:500}
.step.done .dot{background:var(--p);border-color:var(--p);color:var(--on-p)}
.step.cur .dot{border-color:var(--p);color:var(--p)}
.step .t{padding-top:4px}
.step.todo .t{color:var(--on-sv)}
.success{text-align:center;padding:24px 8px}
.thumb{width:96px;height:96px;border-radius:50%;border:4px solid var(--p);color:var(--p);display:grid;place-items:center;margin:0 auto 16px}

/* certificate */
.cert{background:var(--s);border:2px solid var(--p);border-radius:24px;padding:24px 20px;position:relative;overflow:hidden}
.cert::before{content:"";position:absolute;inset:6px;border:1px dashed var(--ol);border-radius:18px;pointer-events:none}
.cert h2{font-size:24px;text-align:center;margin:12px 0 4px}
.cert .no{text-align:center;color:var(--on-sv);font-size:14px;margin-bottom:16px}

function stats(){var done=S.txs.filter(function(t){return t.step>=6}),kg=0,co=0,val=0,av=0;
 done.forEach(function(t){var l=byId(t.lid);if(!l)return;var m=MAT[l.mat];kg+=t.qty;co+=t.qty*m.f;val+=t.qty*t.price;av+=t.qty*m.b});
 return{done:done,kg:kg,co:co,val:val,av:av,open:S.txs.length-done.length}}

function qr(seed){var n=21,cells='',r=seed*9301+49297;function rnd(){r=(r*9301+49297)%233280;return r/233280}
 function fin(x,y){return(x<7&&y<7)||(x>=n-7&&y<7)||(x<7&&y>=n-7)}
 for(var y=0;y<n;y++)for(var x=0;x<n;x++){var on;if(fin(x,y)){var fx=x%(n-7>x?n:n-7),lx=x>=n-7?x-(n-7):x,ly=y>=n-7?y-(n-7):y;on=lx===0||lx===6||ly===0||ly===6||(lx>=2&&lx<=4&&ly>=2&&ly<=4)}else on=rnd()>.5;if(on)cells+='<rect x="'+x+'" y="'+y+'" width="1" height="1"/>'}
 return '<svg class="qr" viewBox="0 0 21 21" fill="currentColor" aria-label="Kode verifikasi contoh" role="img">'+cells+'</svg>'}

 var t=S.txs.filter(function(x){return String(x.id)===id})[0];if(!t)return notFound();
 if(t.step<6)return bar('Sertifikat')+'<div class="page"><div class="empty"><h3>Sertifikat belum terbit</h3><p>Sertifikat terbit setelah barang dikonfirmasi dan dana dicairkan.</p><a class="btn tonal" href="#/transaksi/'+t.id+'">Lihat status transaksi</a></div></div>';
 var l=byId(t.lid)||{nama:'-',mat:'kayu',seller:'-'},m=MAT[l.mat]||MAT.kayu,co=t.qty*m.f,no='CRC-'+new Date(t.date).getFullYear()+'-'+String(t.id).padStart(4,'0');
 return bar('Sertifikat')+'<div class="page narrow" style="max-width:600px"><div class="cert"><span class="demo-tag">Contoh</span><div style="text-align:center;color:var(--p)">'+logo(44)+'</div><h2>Sertifikat Keberlanjutan</h2><p class="no">Nomor '+no+'</p><p class="sub" style="text-align:center">Menyatakan bahwa limbah industri berikut dialihkan dari TPA menjadi bahan baku sirkular.</p>'+
 '<div class="who"><span class="sub">Penghasil limbah</span><b>'+esc(l.seller)+'</b></div><div class="who"><span class="sub">Pembeli atau pendaur ulang</span><b>'+esc(S.user.name)+'</b></div>'+
 '<div class="card" style="margin-top:12px"><div class="kv"><span>Material</span><b>'+esc(l.nama)+'</b></div><div class="kv"><span>Volume dialihkan dari TPA</span><b>'+kgf(t.qty)+'</b></div><div class="kv"><span>Emisi karbon dihemat</span><b>'+num(co)+' kg CO₂e</b></div><div class="kv"><span>Setara penyerapan pohon</span><b>'+num(co/21,1)+' pohon setahun</b></div><div class="kv"><span>Tanggal transaksi</span><b>'+fmtDate(t.date)+'</b></div></div>'+
 '<div class="foot">'+qr(t.id+3)+'<p>Pindai kode untuk memverifikasi sertifikat. Angka dihitung dengan faktor emisi contoh dan harus diganti faktor resmi untuk laporan ESG.</p></div></div>'+

  upd();$('#bq').addEventListener('input',upd)},
 doBuy:function(el){var l=byId(el.dataset.id),q=+$('#bq').value,id=(S.txs.reduce(function(m,t){return Math.max(m,t.id)},0))+1;
  S.txs.push({id:id,lid:l.id,qty:q,price:l.harga,step:1,date:new Date().toISOString()});save();closeDlg();snack('Dana masuk escrow');location.hash='#/transaksi/'+id},
 advance:function(el){var t=S.txs.filter(function(x){return String(x.id)===el.dataset.id})[0];if(t&&t.step<6){t.step++;save();render();snack(t.step>=6?'Sertifikat ESG terbit':'Status diperbarui')}},
 copyEsg:function(el){var t=S.txs.filter(function(x){return String(x.id)===el.dataset.id})[0],l=byId(t.lid)||{nama:'-',mat:'kayu'},m=MAT[l.mat];
  var txt='Circula | Sertifikat CRC-'+new Date(t.date).getFullYear()+'-'+String(t.id).padStart(4,'0')+'\nMaterial: '+l.nama+'\nVolume dialihkan dari TPA: '+num(t.qty)+' kg\nEmisi dihemat (faktor contoh): '+num(t.qty*m.f)+' kg CO2e\nTanggal: '+fmtDate(t.date);
  try{navigator.clipboard.writeText(txt).then(function(){snack('Ringkasan ESG disalin')},function(){snack('Tidak bisa menyalin otomatis')})}catch(e){snack('Tidak bisa menyalin otomatis')}},
 print:function(){try{window.print()}catch(e){snack('Cetak tidak tersedia di tampilan ini')}},
 setRole:function(el){S.user.role=el.dataset.v;S.ui.peta.mode=null;save();render()},
 theme:function(el){S.theme=el.dataset.v;applyTheme();save();render()},
 reset:function(){S.mine=[];S.favs=[];seed();save();render();snack('Data demo diatur ulang')},
 logout:function(){S.seen=false;save();location.hash='#/splash'}
};
document.addEventListener('click',function(e){var el=e.target.closest('[data-act]');if(!el)return;var f=ACT[el.dataset.act];if(!f)return;
 if(el.dataset.act==='fav'||el.dataset.act==='contactBuyer'){e.preventDefault();e.stopPropagation()}
 f(el)});
dlg.addEventListener('click',function(e){if(e.target===dlg)closeDlg()});
window.addEventListener('hashchange',render);
render();
})();
</script>
